spring.application.name=nfl-api
# Plataformas como Render/Railway informam a porta pela variável PORT
server.port=${PORT:8080}

# ---------- Banco H2 (em memória) ----------
spring.datasource.url=jdbc:h2:mem:nfldb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Paginação ----------
spring.data.web.pageable.max-page-size=100

# ---------- Versionamento da API (header X-API-Version) ----------
spring.mvc.apiversion.use.header=X-API-Version
spring.mvc.apiversion.default=1

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true

# ---------- Configurações da NFL API ----------
# Chave ADMIN criada na inicialização (apenas para desenvolvimento!)
nfl.security.admin-key=nfl_admin_dev_key_123

# Rate limiting: requisições por janela, por IP
nfl.rate-limit.capacity=60
nfl.rate-limit.window-seconds=60

# CORS: origens e métodos permitidos
nfl.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
nfl.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
nfl.cors.max-age-seconds=3600

# Idempotência: validade das chaves X-Idempotency-Key
nfl.idempotency.ttl-hours=24
