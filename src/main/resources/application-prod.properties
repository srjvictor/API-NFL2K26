# =========================================================
# Perfil de produção — ative com SPRING_PROFILES_ACTIVE=prod
# Sobrescreve apenas o que muda em relação ao application.properties
# =========================================================

# A API roda atrás do proxy HTTPS da plataforma: usa os headers X-Forwarded-*
# para gerar links HATEOAS com https/domínio corretos e para o rate limit ver o IP real do cliente
server.forward-headers-strategy=framework

# Console do H2 desligado em produção
spring.h2.console.enabled=false

# Chave ADMIN obrigatória vinda de variável de ambiente (sem valor padrão:
# a aplicação não sobe se NFL_ADMIN_KEY não estiver definida)
nfl.security.admin-key=${NFL_ADMIN_KEY}

# Origens de frontends autorizadas, separadas por vírgula (ex.: https://meu-front.vercel.app).
# Vazio = nenhuma origem externa; o Swagger da própria API continua funcionando.
nfl.cors.allowed-origins=${NFL_CORS_ALLOWED_ORIGINS:}

# Limite de requisições configurável por variável de ambiente
nfl.rate-limit.capacity=${NFL_RATE_LIMIT_CAPACITY:60}

# Logs mais enxutos
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
