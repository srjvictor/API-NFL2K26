# Blueprint do Render: New + > Blueprint > selecione este repositório
services:
  - type: web
    name: nfl-api
    runtime: docker
    plan: free
    healthCheckPath: /api
    envVars:
      - key: NFL_ADMIN_KEY
        generateValue: true   # o Render gera uma chave aleatória (veja em Environment)
      - key: NFL_CORS_ALLOWED_ORIGINS
        value: ""             # ex.: https://meu-front.vercel.app
